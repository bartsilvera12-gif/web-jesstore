<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JESS STORE · Admin</title>
<link rel="icon" type="image/png" href="uploads/logo-1785247877729.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./backend/supabase-config.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:radial-gradient(1000px 600px at 80% -10%,rgba(41,182,255,.14),transparent 55%),linear-gradient(180deg,#04060f 0%,#060a1a 40%,#04060f 100%);color:#e8eefc;font-family:'Rajdhani',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:#3ea6ff;text-decoration:none}
  a:hover{color:#7cc6ff}
  input,select,button,textarea{font-family:inherit;color:inherit}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:#070b19}
  ::-webkit-scrollbar-thumb{background:#182645;border-radius:6px}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .btn{background:rgba(41,182,255,.14);border:1.5px solid rgba(41,182,255,.55);color:#bfe4ff;font-weight:800;padding:9px 14px;border-radius:10px;cursor:pointer;font-size:14px;transition:all .18s;display:inline-flex;align-items:center;gap:8px}
  .btn:hover{background:rgba(41,182,255,.25);border-color:#3ea6ff}
  .btn.primary{background:linear-gradient(135deg,#ffe08a,#f5c542,#c9971f);color:#1a1204;border:none;font-weight:900}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.danger{background:rgba(242,84,91,.14);border-color:#f2545b;color:#ffb0b4}
  .btn.danger:hover{background:rgba(242,84,91,.28)}
  .btn.success{background:rgba(62,232,122,.14);border-color:#3ee87a;color:#7ff0a5}
  .btn.success:hover{background:rgba(62,232,122,.28)}
  .btn.ghost{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.14);color:#cdd8ef}
  .btn.small{padding:6px 10px;font-size:12.5px;border-radius:8px}
  .input{background:#070c1c;border:1px solid rgba(255,255,255,.14);color:#fff;padding:11px 14px;border-radius:10px;font-size:15px;font-weight:600;width:100%}
  .input:focus{outline:none;border-color:#3ea6ff}
  .label{display:block;font-weight:700;font-size:13px;color:#c3d2ee;margin-bottom:6px;letter-spacing:.3px}
  .card{background:linear-gradient(180deg,rgba(13,20,44,.85),rgba(7,11,26,.9));border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:20px}
  .card h3{font-family:'Orbitron';font-weight:800;font-size:15px;color:#8ea3c8;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px}
  .h1{font-family:'Orbitron';font-weight:900;font-size:26px;letter-spacing:.5px}
  .h2{font-family:'Orbitron';font-weight:800;font-size:18px}
  .muted{color:#8ea3c8}
  .tag{display:inline-block;padding:3px 10px;border-radius:100px;font-weight:800;font-size:11px;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap}
  .tag-pending{background:rgba(255,215,106,.14);color:#ffd76a;border:1px solid rgba(255,215,106,.35)}
  .tag-payment_review,.tag-under_review{background:rgba(41,182,255,.14);color:#8fe3ff;border:1px solid rgba(41,182,255,.35)}
  .tag-paid,.tag-approved{background:rgba(62,232,122,.14);color:#7ff0a5;border:1px solid rgba(62,232,122,.35)}
  .tag-processing{background:rgba(143,227,255,.14);color:#8fe3ff;border:1px solid rgba(143,227,255,.35)}
  .tag-completed{background:rgba(62,232,122,.22);color:#3ee87a;border:1px solid rgba(62,232,122,.55)}
  .tag-cancelled,.tag-rejected,.tag-refunded{background:rgba(242,84,91,.14);color:#ffb0b4;border:1px solid rgba(242,84,91,.35)}
  .tag-owner{background:rgba(245,197,66,.15);color:#ffd76a;border:1px solid rgba(245,197,66,.45)}
  .tag-admin{background:rgba(41,182,255,.14);color:#8fe3ff;border:1px solid rgba(41,182,255,.35)}
  .tag-active{background:rgba(62,232,122,.15);color:#7ff0a5;border:1px solid rgba(62,232,122,.4)}
  .tag-inactive{background:rgba(255,255,255,.06);color:#8ea3c8;border:1px solid rgba(255,255,255,.15)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px;vertical-align:middle}
  th{color:#8ea3c8;font-weight:700;font-size:11px;letter-spacing:1px;text-transform:uppercase;background:rgba(255,255,255,.02)}
  tr:hover td{background:rgba(41,182,255,.04)}
  .checkbox{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .checkbox input{width:18px;height:18px;accent-color:#f5c542}

  /* LOGIN */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  #login .card{width:min(420px,100%);text-align:center;padding:30px}
  #login img{height:110px;margin:0 auto 10px;filter:drop-shadow(0 4px 20px rgba(41,182,255,.55))}

  /* APP LAYOUT */
  #app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
  aside{background:rgba(4,7,15,.7);border-right:1px solid rgba(245,197,66,.18);padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto}
  aside .logo{display:flex;justify-content:center;padding:6px 0 18px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:14px}
  aside .logo img{height:140px;filter:drop-shadow(0 4px 22px rgba(41,182,255,.6))}
  aside .nav{display:flex;flex-direction:column;gap:4px;flex:1}
  aside .nav a{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;color:#cdd8ef;font-weight:700;font-size:15px;cursor:pointer;transition:all .18s}
  aside .nav a:hover{background:rgba(41,182,255,.1);color:#fff}
  aside .nav a.active{background:linear-gradient(135deg,rgba(245,197,66,.14),rgba(41,182,255,.14));color:#fff;border:1px solid rgba(245,197,66,.35)}
  aside .who{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.07);font-size:13px;color:#8ea3c8}
  aside .who b{display:block;color:#e8eefc;font-size:14px;margin-bottom:4px;word-break:break-all}

  main{padding:26px 30px;max-width:100%;overflow-x:hidden}
  .page-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:22px}
  .page-head .titles{display:flex;flex-direction:column;gap:4px}
  .page-head .titles .sub{color:#8ea3c8;font-size:14px}
  .back{background:none;border:none;color:#8fe3ff;font-weight:700;font-size:14px;cursor:pointer;padding:0;margin-bottom:12px;display:inline-flex;align-items:center;gap:6px}
  .back:hover{color:#fff}
  .grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:24px}
  .stat{padding:20px}
  .stat .k{color:#8ea3c8;font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
  .stat .v{font-family:'Orbitron';font-weight:900;font-size:26px;color:#fff}
  .stat.gold .v{background:linear-gradient(135deg,#ffe08a,#f5c542);-webkit-background-clip:text;background-clip:text;color:transparent}
  .stat.blue .v{background:linear-gradient(135deg,#8fe3ff,#3ea6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .stat.green .v{background:linear-gradient(135deg,#7ff0a5,#3ee87a);-webkit-background-clip:text;background-clip:text;color:transparent}

  .table-wrap{background:linear-gradient(180deg,rgba(13,20,44,.85),rgba(7,11,26,.9));border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden}
  .table-scroll{overflow-x:auto}

  .kv{display:grid;grid-template-columns:120px 1fr;gap:8px 16px;font-size:14px}
  .kv .k{color:#8ea3c8;font-weight:700}
  .kv .v{color:#e8eefc;font-weight:600}

  /* TOAST */
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;background:linear-gradient(135deg,#0d1730,#111d3e);border:1px solid rgba(245,197,66,.4);color:#fff;font-weight:700;padding:12px 20px;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.5);display:none}
  #toast.on{display:block}
  #toast.err{border-color:#f2545b}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  @media (max-width:900px){
    #app{grid-template-columns:1fr}
    aside{position:relative;height:auto;flex-direction:row;flex-wrap:wrap;padding:14px;gap:8px}
    aside .logo{border:none;padding:0;margin:0;flex:1}
    aside .logo img{height:60px}
    aside .nav{flex-direction:row;flex-wrap:wrap;flex:100%}
    aside .who{margin:0;padding:0;border:none;flex:100%}
    main{padding:18px 14px}
    .grid-2,.grid-3{grid-template-columns:1fr}
    .kv{grid-template-columns:1fr}
  }

  .loader{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:#8fe3ff;border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* MODAL */
  .modal-bg{position:fixed;inset:0;z-index:100;background:rgba(2,4,10,.78);backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto;animation:fadeIn .18s ease}
  .modal-bg.on{display:flex}
  .modal{width:min(720px,100%);background:linear-gradient(180deg,#0a1024,#070b1a);border:1px solid rgba(245,197,66,.35);border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.7);margin:auto 0;animation:popIn .22s cubic-bezier(.2,.7,.3,1.2)}
  .modal.wide{width:min(860px,100%)}
  .modal.narrow{width:min(460px,100%)}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;background:#0a1024;z-index:2;border-radius:18px 18px 0 0}
  .modal-head .h2{font-family:'Orbitron';font-weight:900;font-size:19px;color:#fff}
  .modal-head .sub{color:#8ea3c8;font-size:13px;margin-top:2px}
  .modal-body{padding:22px}
  .modal-foot{padding:16px 22px;border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;bottom:0;background:#0a1024;border-radius:0 0 18px 18px}
  .modal-foot .l,.modal-foot .r{display:flex;gap:10px;flex-wrap:wrap}
  .close{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#fff;width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:17px;display:inline-flex;align-items:center;justify-content:center}
  .close:hover{background:rgba(41,182,255,.18);border-color:#3ea6ff}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

  /* CUSTOM DROPDOWN */
  .cs{position:relative;font-family:inherit}
  .cs-btn{width:100%;background:#070c1c;border:1px solid rgba(255,255,255,.14);color:#fff;padding:11px 14px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;transition:border-color .18s}
  .cs-btn:hover{border-color:#3ea6ff}
  .cs.open > .cs-btn{border-color:#3ea6ff;box-shadow:0 0 0 3px rgba(41,182,255,.15)}
  .cs-current{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cs-chev{color:#8fe3ff;font-size:11px;transition:transform .18s;flex-shrink:0}
  .cs.open .cs-chev{transform:rotate(180deg)}
  .cs-panel{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:150;max-height:280px;overflow-y:auto;background:linear-gradient(180deg,#0a1024,#070b1a);border:1px solid rgba(41,182,255,.45);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.7);padding:6px;animation:popIn .16s cubic-bezier(.2,.7,.3,1.2)}
  .cs-panel[hidden]{display:none}
  .cs-opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:10px 12px;background:transparent;border:none;color:#dbe6fb;font-weight:600;font-size:14px;cursor:pointer;border-radius:8px;text-align:left;transition:all .12s}
  .cs-opt:hover{background:rgba(41,182,255,.14);color:#fff}
  .cs-opt.selected{background:rgba(245,197,66,.15);color:#ffd76a}
  .cs-opt-price{color:#8ea3c8;font-family:'Orbitron';font-size:13px;flex-shrink:0}
  .cs-opt.selected .cs-opt-price{color:#ffd76a}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" style="display:none">
  <div class="card">
    <img src="uploads/logo-1785247877729.png" alt="JESS STORE">
    <div class="h1" style="margin:6px 0 4px">Panel de administración</div>
    <div class="muted" style="margin-bottom:22px">Ingresá con tu cuenta autorizada</div>
    <form id="loginForm" style="text-align:left;display:flex;flex-direction:column;gap:12px">
      <div><label class="label">Correo</label><input class="input" type="email" name="email" required autocomplete="email"></div>
      <div><label class="label">Contraseña</label><input class="input" type="password" name="password" required autocomplete="current-password"></div>
      <button class="btn primary" type="submit" style="padding:13px;font-size:15px;margin-top:6px;justify-content:center">Entrar</button>
      <div id="loginMsg" class="muted" style="text-align:center;font-size:13px;min-height:16px"></div>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <aside>
    <div class="logo"><img src="uploads/logo-1785247877729.png" alt="JESS"></div>
    <nav class="nav" id="nav">
      <a data-view="dashboard" class="active">Inicio</a>
      <a data-view="orders">Pedidos</a>
      <a data-view="sales">Ventas</a>
      <a data-view="products">Productos</a>
      <a data-view="settings">Configuración</a>
      <a data-view="activity">Actividad</a>
      <a data-view="admins" id="navAdmins" style="display:none">Administradores</a>
    </nav>
    <div class="who">
      <b id="whoEmail">—</b>
      <span id="whoRole">—</span>
      <div style="margin-top:10px"><button class="btn ghost small" id="btnLogout">Cerrar sesión</button></div>
      <div style="margin-top:10px;text-align:center"><a href="/" style="font-size:12px">← Volver al sitio</a></div>
    </div>
  </aside>
  <main id="main"></main>
</div>

<div id="toast"></div>

<!-- MODAL -->
<div class="modal-bg" id="modal">
  <div class="modal" id="modalCard">
    <div class="modal-head">
      <div><div class="h2" id="modalTitle">—</div><div class="sub" id="modalSub" style="display:none"></div></div>
      <button class="close" id="modalClose" aria-label="Cerrar">✕</button>
    </div>
    <div class="modal-body" id="modalBody">—</div>
    <div class="modal-foot" id="modalFoot" style="display:none"><div class="l" id="modalFootL"></div><div class="r" id="modalFootR"></div></div>
  </div>
</div>

<script>
  const cfg = window.JESS_SUPABASE || {};
  if(!cfg.url || !cfg.anonKey || cfg.anonKey === 'REEMPLAZAR_CON_ANON_KEY'){
    document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#e8eefc"><h2>Falta configurar Supabase</h2><p>Editá <code>backend/supabase-config.js</code> con tu <b>URL</b> y <b>anon key</b> reales.</p></div>';
    throw new Error('supabase not configured');
  }
  const sb = window.supabase.createClient(cfg.url, cfg.anonKey);
  const sbJess = sb.schema ? sb.schema('jess') : sb;

  const state = { view:'dashboard', me:null, isOwner:false, ctx:{} };

  const $ = s => document.querySelector(s);
  const escapeHtml = s => (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = n => Number(n||0).toLocaleString('es-PY');
  const fmtDate = s => { if(!s) return '—'; const d=new Date(s); return d.toLocaleString('es-PY',{dateStyle:'short',timeStyle:'short'}); };
  const toast = (msg, err=false) => { const t=$('#toast'); t.textContent=msg; t.className = 'on' + (err?' err':''); clearTimeout(toast._t); toast._t = setTimeout(()=>t.className='',2600); };

  // ---- Modal system
  function openModal({ title, subtitle, bodyHtml, size, actions }){
    $('#modalTitle').textContent = title || '';
    const sub = $('#modalSub');
    if(subtitle){ sub.innerHTML = subtitle; sub.style.display=''; } else { sub.style.display='none'; }
    $('#modalBody').innerHTML = bodyHtml || '';
    $('#modalCard').className = 'modal' + (size==='wide'?' wide':size==='narrow'?' narrow':'');
    const foot = $('#modalFoot'), footL = $('#modalFootL'), footR = $('#modalFootR');
    footL.innerHTML = ''; footR.innerHTML = '';
    if(actions && actions.length){
      foot.style.display = 'flex';
      actions.forEach(a => {
        const b = document.createElement('button');
        b.className = 'btn ' + (a.style||'ghost');
        b.textContent = a.label;
        b.onclick = a.onClick;
        (a.side==='left' ? footL : footR).appendChild(b);
      });
    } else foot.style.display = 'none';
    $('#modal').classList.add('on');
    document.body.style.overflow = 'hidden';
  }
  function closeModal(){ $('#modal').classList.remove('on'); document.body.style.overflow = ''; }
  window.closeModal = closeModal;
  document.addEventListener('DOMContentLoaded', () => {
    $('#modalClose').onclick = closeModal;
    $('#modal').addEventListener('click', e => { if(e.target.id === 'modal') closeModal(); });
    document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
  });

  function askConfirm({ title, message, confirmLabel='Confirmar', cancelLabel='Cancelar', danger=false }){
    return new Promise(resolve => {
      openModal({
        title: title || '¿Confirmar?',
        size: 'narrow',
        bodyHtml: `<div style="color:#c3d2ee;font-size:15px;line-height:1.5">${escapeHtml(message||'')}</div>`,
        actions: [
          { label: cancelLabel, style:'ghost',  onClick: () => { closeModal(); resolve(false); } },
          { label: confirmLabel, style: danger?'danger':'primary', onClick: () => { closeModal(); resolve(true); } }
        ]
      });
    });
  }

  const STATUS_LABEL = { pending:'Pendiente', payment_review:'Revisar pago', paid:'Pagado', processing:'En proceso', completed:'Completado', cancelled:'Cancelado', rejected:'Rechazado', approved:'Aprobado', under_review:'En revisión', refunded:'Reembolsado' };
  const ROLE_LABEL = { owner:'Dueño', admin:'Admin' };
  const statusTag = s => `<span class="tag tag-${s||'pending'}">${(STATUS_LABEL[s]||s||'—').toUpperCase()}</span>`;

  // ---- AUTH
  async function boot(){
    const { data:{session} } = await sb.auth.getSession();
    if(!session){ showLogin(); return; }
    const ok = await checkAdmin();
    if(!ok){ await sb.auth.signOut(); showLogin('No estás autorizado como administrador.'); return; }
    showApp(session.user);
  }
  async function checkAdmin(){
    try{ const { data } = await sbJess.rpc('is_admin'); return !!data; }
    catch(e){ console.error(e); return false; }
  }
  function showLogin(msg){ $('#app').style.display='none'; $('#login').style.display=''; if(msg) $('#loginMsg').textContent=msg; }
  function showApp(user){
    $('#login').style.display='none';
    $('#app').style.display='grid';
    state.me = user;
    $('#whoEmail').textContent = user.email;
    sbJess.rpc('is_owner').then(({data})=>{
      state.isOwner = !!data;
      $('#whoRole').textContent = state.isOwner ? 'Dueño' : 'Administrador';
      $('#navAdmins').style.display = state.isOwner ? '' : 'none';
    });
    router();
  }

  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const f=e.target; const email=f.email.value.trim(); const password=f.password.value;
    $('#loginMsg').innerHTML='<span class="loader"></span> Ingresando…';
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ $('#loginMsg').textContent = error.message || 'Error al ingresar'; return; }
    const ok = await checkAdmin();
    if(!ok){ await sb.auth.signOut(); $('#loginMsg').textContent='Tu cuenta no está en la lista de administradores.'; return; }
    const { data:{user} } = await sb.auth.getUser();
    showApp(user);
  });
  $('#btnLogout').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

  $('#nav').addEventListener('click', e => {
    const a = e.target.closest('a[data-view]');
    if(!a) return;
    goto(a.dataset.view);
  });

  function goto(view, ctx){
    state.view = view; state.ctx = ctx || {};
    document.querySelectorAll('#nav a').forEach(x => x.classList.toggle('active', x.dataset.view === view));
    router();
  }

  function router(){
    const v = state.view;
    if(v==='dashboard')   return viewDashboard();
    if(v==='orders')      return viewOrders();
    if(v==='sales')       return viewSales();
    if(v==='products')    return viewProducts();
    if(v==='settings')    return viewSettings();
    if(v==='activity')    return viewActivity();
    if(v==='admins')      return viewAdmins();
  }

  // =====================================================================
  // INICIO / DASHBOARD
  // =====================================================================
  async function viewDashboard(){
    const m = $('#main');
    m.innerHTML = `
      <div class="page-head">
        <div class="titles"><div class="h1">Inicio</div><div class="sub">Resumen general de la tienda</div></div>

  async function loadOrders(){
    const status = $('#fStatus').value;
    let q = sbJess.from('v_orders').select('*').order('created_at',{ascending:false}).limit(300);
    if(status) q = q.eq('status', status);
    const { data, error } = await q;
    if(error){ $('#ordersBox').innerHTML = errBox(error); return; }
    $('#ordersBox').innerHTML = data.length ? ordersTable(data) : '<div class="card muted">No hay pedidos con ese filtro.</div>';
    wireOrderRows();
  }

  function ordersTable(rows){
    return `<div class="table-wrap"><div class="table-scroll"><table>
      <thead><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th>ID Jugador</th><th>Total</th><th>Estado</th><th>Pago</th><th></th></tr></thead>
      <tbody>${rows.map(o => `
        <tr>
          <td><b style="font-family:Orbitron">${escapeHtml(o.order_number||'—')}</b></td>
          <td>${fmtDate(o.created_at)}</td>
          <td>${escapeHtml(o.customer_name||'—')}<br><span class="muted" style="font-size:12px">${escapeHtml(o.customer_phone||'')}</span></td>

  // ---- PEDIDO MANUAL (crear desde admin: p. ej. venta por WhatsApp)
  async function openManualOrderModal(){
    openModal({ title:'Cargar pedido manual', bodyHtml:'<div class="muted"><span class="loader"></span> cargando…</div>', size:'wide' });
    const { data:products, error } = await sbJess.from('products').select('*').eq('is_active', true).order('sort_order');
    if(error){ openModal({ title:'Error', bodyHtml:errBox(error), size:'narrow', actions:[{label:'Cerrar', style:'ghost', onClick:closeModal}] }); return; }
    if(!(products||[]).length){ openModal({ title:'Sin productos', bodyHtml:'<div class="muted">Cargá al menos un producto en la sección Productos antes de crear pedidos manuales.</div>', size:'narrow', actions:[{label:'Cerrar', style:'ghost', onClick:closeModal}] }); return; }

    // Estado local del formulario
    const items = [{ product_id: products[0].id, quantity: 1 }];

    const productOptions = () => (products||[]).map(p => `<option value="${p.id}">${escapeHtml(p.name)} · ${fmt(p.price)} Gs.</option>`).join('');

    const renderItemsList = () => {
      const box = document.getElementById('manualItems');
      if(!box) return;
      box.innerHTML = items.map((it, idx) => {
        const p = products.find(x => x.id === it.product_id) || products[0];
        const subtotal = Number(p.price||0) * Number(it.quantity||1);
        const opts = (products||[]).map(o => `<button type="button" class="cs-opt ${o.id===it.product_id?'selected':''}" data-cs-pick="${idx}" data-cs-value="${o.id}"><span>${escapeHtml(o.name)}</span><span class="cs-opt-price">${fmt(o.price)} Gs.</span></button>`).join('');
        return `
          <div style="display:grid;grid-template-columns:1fr 100px 130px 44px;gap:10px;align-items:end;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)">
            <div>
              <label class="label">Producto</label>
              <div class="cs" data-cs="${idx}">
                <button type="button" class="cs-btn" data-cs-toggle="${idx}">
                  <span class="cs-current">${escapeHtml(p.name)} · ${fmt(p.price)} Gs.</span>
                  <span class="cs-chev">▼</span>
                </button>
                <div class="cs-panel" data-cs-panel="${idx}" hidden>${opts}</div>
              </div>
            </div>
            <div><label class="label">Cantidad</label><input class="input" type="number" min="1" value="${it.quantity}" data-item="${idx}" data-f="quantity"></div>
            <div><label class="label">Subtotal</label><div class="input" style="display:flex;align-items:center;background:rgba(255,255,255,.02)"><b style="color:#ffd76a;font-family:Orbitron">${fmt(subtotal)} Gs.</b></div></div>
            <div><label class="label" style="opacity:0">.</label><button class="btn danger small" data-remove="${idx}" ${items.length===1?'disabled style="opacity:.3;cursor:not-allowed"':''} title="Quitar">✕</button></div>
          </div>`;
      }).join('');
      const totalEl = document.getElementById('manualTotal');
      const total = items.reduce((s, it) => {
        const p = products.find(x => x.id === it.product_id) || {price:0};
        return s + Number(p.price||0) * Number(it.quantity||1);
      }, 0);
      if(totalEl) totalEl.textContent = fmt(total) + ' Gs.';
      // Wire cantidad
      box.querySelectorAll('input[data-item]').forEach(el => {
        el.addEventListener('input', () => {
          const idx = Number(el.dataset.item);
          items[idx].quantity = Number(el.value||1);
          renderItemsList();
        });
      });
      // Wire custom dropdown toggle
      box.querySelectorAll('[data-cs-toggle]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const idx = btn.dataset.csToggle;
          const cs = btn.closest('.cs');
          const panel = cs.querySelector('.cs-panel');
          const wasOpen = cs.classList.contains('open');
          // cerrar cualquier otro
          document.querySelectorAll('.cs.open').forEach(x => { x.classList.remove('open'); const p = x.querySelector('.cs-panel'); if(p) p.hidden = true; });
          if(!wasOpen){ cs.classList.add('open'); panel.hidden = false; }
        });
      });
      // Wire custom dropdown pick
      box.querySelectorAll('[data-cs-pick]').forEach(opt => {
        opt.addEventListener('click', e => {
          e.stopPropagation();
          const idx = Number(opt.dataset.csPick);
          items[idx].product_id = opt.dataset.csValue;
          renderItemsList();
        });
      });
      // Wire eliminar ítem
      box.querySelectorAll('[data-remove]').forEach(b => b.onclick = () => {
        if(items.length <= 1) return;
        items.splice(Number(b.dataset.remove), 1);
        renderItemsList();
      });
    };

    // Cerrar dropdowns al click fuera
    if(!window._csOutsideBound){
      window._csOutsideBound = true;
      document.addEventListener('click', () => {
        document.querySelectorAll('.cs.open').forEach(x => { x.classList.remove('open'); const p = x.querySelector('.cs-panel'); if(p) p.hidden = true; });
      });
    }

    const body = `
      <div class="grid-2">
        <div><label class="label">Nombre del cliente <span style="color:#ff6b6b">*</span></label><input class="input" id="mName" placeholder="Nombre y apellido"></div>
        <div><label class="label">Teléfono <span style="color:#ff6b6b">*</span></label><input class="input" id="mPhone" placeholder="+595 9XX XXX XXX"></div>
        <div><label class="label">Correo (opcional)</label><input class="input" id="mEmail" type="email" placeholder="correo@ejemplo.com"></div>
        <div><label class="label">ID del jugador <span style="color:#ff6b6b">*</span></label><input class="input" id="mPlayer" placeholder="ID de Free Fire"></div>
        <div><label class="label">Método de pago</label>
          <select class="input" id="mMethod">
            <option>Transferencia Bancaria</option>
            <option>Tigo Money</option>
            <option>Billetera Personal</option>
            <option>Efectivo</option>
            <option>Otro</option>
          </select>
        </div>
        <div><label class="label">Estado inicial</label>
          <select class="input" id="mStatus">
            <option value="pending">Pendiente (esperando pago)</option>
            <option value="paid">Pagado</option>
            <option value="completed" selected>Completado (ya se cargaron los diamantes)</option>
          </select>
        </div>
      </div>
      <div style="margin-top:14px"><label class="label">Notas (opcional)</label><textarea class="input" id="mNotes" rows="2" placeholder="Ej: venta por WhatsApp, ya se envió comprobante"></textarea></div>

      <div style="margin-top:22px">
        <div class="row" style="justify-content:space-between;margin-bottom:6px">
          <div><b class="h2">Ítems del pedido</b></div>
          <button class="btn small" id="addItem">+ Agregar ítem</button>
        </div>
        <div id="manualItems"></div>
        <div class="row" style="justify-content:flex-end;margin-top:14px;padding-top:14px;border-top:1px solid rgba(245,197,66,.3)">
          <div style="font-family:Orbitron;font-weight:900;font-size:18px">Total: <span id="manualTotal" style="color:#ffd76a">0 Gs.</span></div>
        </div>
      </div>`;

    const saveHandler = async () => {
      const name  = $('#mName').value.trim();
      const phone = $('#mPhone').value.trim();
      const email = $('#mEmail').value.trim() || null;
      const player_id = $('#mPlayer').value.trim();
      const method = $('#mMethod').value;
      const initStatus = $('#mStatus').value;
      const notes = $('#mNotes').value.trim() || null;
      if(!name)      { toast('Falta el nombre del cliente', true); return; }
      if(!phone)     { toast('Falta el teléfono', true); return; }
      if(!player_id) { toast('Falta el ID del jugador', true); return; }
      if(!items.length) { toast('Agregá al menos un ítem', true); return; }

      const payload = {
        customer: { name, phone, email },
        player_id,
        payment_method: method,
        discount: 0,
        notes,
        items: items.map(it => {
          const p = products.find(x => x.id === it.product_id);
          return {
            product_id: p.id,
            product_name: p.name,
            diamonds: p.diamonds,
            bonus_diamonds: p.bonus_diamonds || 0,
            quantity: Number(it.quantity||1),
            unit_price: Number(p.price||0)
          };
        })
      };
      const { data, error } = await sb.rpc('create_jess_order', { payload });
      if(error){ toast(error.message, true); return; }
      const newId = data && data.order_id;
      if(newId && initStatus !== 'pending'){
        await sbJess.rpc('set_order_status', { p_order_id:newId, p_status:initStatus, p_notes:notes });
      }
      toast('Pedido registrado: ' + (data && data.order_number || ''));
      closeModal();
      if(state.view === 'orders') loadOrders();
      if(state.view === 'dashboard') viewDashboard();
    };

    openModal({
      title: 'Cargar pedido manual',
      subtitle: 'Registrar una venta hecha por WhatsApp u otro canal',
      size: 'wide',
      bodyHtml: body,
      actions: [
        { label:'Cancelar', style:'ghost', onClick:closeModal },
        { label:'Registrar pedido', style:'primary', onClick:saveHandler }
      ]
    });

    renderItemsList();
    document.getElementById('addItem').onclick = () => {
      items.push({ product_id: products[0].id, quantity: 1 });
      renderItemsList();
    };
  }
  window.openManualOrderModal = openManualOrderModal;

  async function viewSales(){
    const m = $('#main');
    const today = new Date().toISOString().slice(0,10);
    const monthAgo = new Date(Date.now() - 30*24*3600*1000).toISOString().slice(0,10);
    m.innerHTML = `
      <div class="page-head">
        <div class="titles"><div class="h1">Historial de ventas</div><div class="sub">Solo pedidos marcados como completados</div></div>
        <div class="row">
          <label class="muted" style="font-size:13px">Desde</label>
          <input type="date" class="input" id="fFrom" value="${monthAgo}" style="width:auto">
          <label class="muted" style="font-size:13px">Hasta</label>
          <input type="date" class="input" id="fTo" value="${today}" style="width:auto">
          <button class="btn primary small" id="applyR">Aplicar</button>
          <button class="btn ghost small" id="expCsv">Exportar CSV</button>
        </div>
      </div>
      <div class="grid-stats" id="salesStats"></div>
      <div class="card" style="margin-bottom:16px"><h3>Ventas por día</h3><div id="chartWrap" class="muted"><span class="loader"></span> cargando…</div></div>
      <div class="card"><h3>Pedidos completados</h3><div id="salesList" class="muted"><span class="loader"></span></div></div>`;
    const load = () => loadSales($('#fFrom').value, $('#fTo').value);
    $('#applyR').onclick = load;
    $('#expCsv').onclick = () => exportSalesCsv($('#fFrom').value, $('#fTo').value);
    load();
  }
  window.viewSales = viewSales;

  async function loadSales(from, to){
    const { data:orders, error } = await sbJess
      .from('v_orders').select('*')
      .eq('status','completed')
      .gte('created_at', from+'T00:00:00').lte('created_at', to+'T23:59:59')
      .order('created_at',{ascending:false}).limit(2000);
    if(error){ $('#salesList').innerHTML = errBox(error); return; }
    const totalRev = (orders||[]).reduce((s,o)=>s+Number(o.total||0),0);
    const totalOrd = (orders||[]).length;
    const totalDia = (orders||[]).reduce((s,o)=>s+Number(o.total_diamonds||0),0);
    const avg = totalOrd ? Math.round(totalRev/totalOrd) : 0;
    $('#salesStats').innerHTML = [
      { k:'Pedidos', v:fmt(totalOrd), cls:'blue' },
      { k:'Ingresos', v:fmt(totalRev)+' Gs', cls:'gold' },
      { k:'Ticket promedio', v:fmt(avg)+' Gs' },
      { k:'Diamantes vendidos', v:fmt(totalDia) }
    ].map(x=>`<div class="stat card ${x.cls||''}"><div class="k">${x.k}</div><div class="v">${x.v}</div></div>`).join('');

    const byDay = {};
    (orders||[]).forEach(o=>{
      const d = (o.created_at||'').slice(0,10);
      if(!byDay[d]) byDay[d] = { day:d, orders:0, revenue:0 };
      byDay[d].orders += 1;
      byDay[d].revenue += Number(o.total||0);
    });
    const days = Object.values(byDay).sort((a,b)=>a.day<b.day?-1:1);
    const maxRev = Math.max(1, ...days.map(d=>d.revenue));
    $('#chartWrap').innerHTML = days.length ? `
      <div style="display:flex;align-items:flex-end;gap:8px;height:190px;padding:8px 0;overflow-x:auto">
        ${days.map(d=>{
          const h = Math.max(4, Math.round(d.revenue / maxRev * 160));
          return `<div title="${d.day}: ${fmt(d.revenue)} Gs. (${d.orders} pedidos)" style="flex:0 0 36px;display:flex;flex-direction:column;align-items:center;gap:6px">
            <div style="width:100%;height:${h}px;background:linear-gradient(180deg,#ffe08a,#c9971f);border-radius:6px 6px 0 0;box-shadow:0 4px 12px rgba(245,197,66,.35)"></div>
            <div class="muted" style="font-size:10px;font-family:monospace">${d.day.slice(5)}</div>
          </div>`;
        }).join('')}
      </div>` : '<div class="muted">Sin ventas en el rango elegido.</div>';

    $('#salesList').innerHTML = (orders||[]).length ? `<div class="table-scroll"><table>
      <thead><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th>ID Jugador</th><th>Diamantes</th><th>Total</th><th></th></tr></thead>
      <tbody>${orders.map(o=>`
        <tr>
          <td><b style="font-family:Orbitron">${escapeHtml(o.order_number)}</b></td>
          <td>${fmtDate(o.created_at)}</td>
          <td>${escapeHtml(o.customer_name)}<br><span class="muted" style="font-size:12px">${escapeHtml(o.customer_phone||'')}</span></td>
          <td>${escapeHtml(o.player_id||'—')}</td>
          <td>${fmt(o.total_diamonds)}</td>
          <td><b>${fmt(o.total)} Gs.</b></td>
          <td style="text-align:right"><button class="btn small" data-order="${o.id}">Ver</button></td>
        </tr>`).join('')}</tbody></table></div>` : '<div class="muted">Sin pedidos completados en el rango.</div>';
    wireOrderRows();
  }

  async function exportSalesCsv(from, to){
    const { data, error } = await sbJess
      .from('v_orders').select('*')
      .eq('status','completed')
      .gte('created_at', from+'T00:00:00').lte('created_at', to+'T23:59:59')
      .order('created_at',{ascending:true}).limit(5000);
    if(error){ toast(error.message, true); return; }
    const cols = ['order_number','created_at','customer_name','customer_phone','player_id','total_diamonds','total','payment_method'];
    const esc = v => { const s = v==null?'':String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
    const lines = [cols.join(',')].concat((data||[]).map(r=>cols.map(c=>esc(r[c])).join(',')));
    const blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `ventas_${from}_a_${to}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
  }

  // =====================================================================
  // PRODUCTOS
  // =====================================================================
  async function viewProducts(){
    const m = $('#main');
    m.innerHTML = `
      <div class="page-head">
        <div class="titles"><div class="h1">Productos</div><div class="sub">Diamantes, precios y disponibilidad</div></div>
        <button class="btn primary" onclick="openProductModal(null)">+ Nuevo producto</button>
      </div>
      <div id="prodBox"><div class="muted"><span class="loader"></span> cargando…</div></div>`;
    const [{data:cats}, {data:prods, error}] = await Promise.all([
      sbJess.from('categories').select('*').order('sort_order'),
      sbJess.from('products').select('*').order('sort_order')
    ]);
    if(error){ $('#prodBox').innerHTML = errBox(error); return; }
    const catMap = Object.fromEntries((cats||[]).map(c => [c.id, c.name]));
    $('#prodBox').innerHTML = `<div class="table-wrap"><div class="table-scroll"><table>
      <thead><tr><th>Nombre</th><th>Categoría</th><th>Diamantes</th><th>Bonus</th><th>Precio</th><th>Estado</th><th>Destacado</th><th></th></tr></thead>
      <tbody>${(prods||[]).map(p=>`
        <tr>
          <td><b>${escapeHtml(p.name)}</b><br><span class="muted" style="font-size:12px">${escapeHtml(p.slug)}</span></td>
          <td>${escapeHtml(catMap[p.category_id]||'—')}</td>
          <td>${fmt(p.diamonds)}</td>

          <td>${p.is_featured ? '<span class="tag tag-owner">DESTACADO</span>' : '<span class="muted">—</span>'}</td>

  async function openProductModal(id){
    openModal({ title: id?'Editar producto':'Nuevo producto', bodyHtml:'<div class="muted"><span class="loader"></span> cargando…</div>', size:'wide' });
    const [{data:cats}, prodResp] = await Promise.all([
      sbJess.from('categories').select('*').order('sort_order'),
      id ? sbJess.from('products').select('*').eq('id', id).single() : Promise.resolve({data:null})
    ]);
    const isNew = !id;
    const p = (prodResp && prodResp.data) || { category_id: (cats||[])[0]?.id, is_active:true, is_featured:false, diamonds:0, bonus_diamonds:0, price:0, sort_order:0 };
    const body = `
      <div class="grid-2">
        <div><label class="label">Nombre del paquete</label><input class="input" id="fname" value="${escapeHtml(p.name||'')}" placeholder="Ej: 100 + 10 diamantes"></div>
        <div><label class="label">Identificador (slug único)</label><input class="input" id="fslug" value="${escapeHtml(p.slug||'')}" placeholder="ff-110"></div>
        <div><label class="label">Categoría</label><select class="input" id="fcat">${(cats||[]).map(c=>`<option value="${c.id}" ${c.id===p.category_id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select></div>
        <div><label class="label">Precio en guaraníes</label><input class="input" id="fprice" type="number" min="0" value="${p.price||0}"></div>
        <div><label class="label">Diamantes base</label><input class="input" id="fdia" type="number" min="1" value="${p.diamonds||0}"></div>
        <div><label class="label">Diamantes bonus</label><input class="input" id="fbon" type="number" min="0" value="${p.bonus_diamonds||0}"></div>
        <div><label class="label">Orden en la lista</label><input class="input" id="fsort" type="number" value="${p.sort_order||0}"></div>
        <div><label class="label">URL de imagen (opcional)</label><input class="input" id="fimg" value="${escapeHtml(p.image_url||'')}" placeholder="https://…"></div>
      </div>
      <div style="margin-top:14px"><label class="label">Descripción</label><textarea class="input" id="fdesc" rows="3">${escapeHtml(p.description||'')}</textarea></div>
      <div class="row" style="margin-top:16px;gap:24px">
        <label class="checkbox"><input type="checkbox" id="factive" ${p.is_active?'checked':''}> <span>Activo (visible en la tienda)</span></label>
        <label class="checkbox"><input type="checkbox" id="ffeat" ${p.is_featured?'checked':''}> <span>Destacado (marca "Más popular")</span></label>
      </div>`;
    const saveHandler = async () => {
      const payload = {
        name: $('#fname').value.trim(),
        slug: $('#fslug').value.trim(),
        category_id: $('#fcat').value,
        price: Number($('#fprice').value||0),
        diamonds: Number($('#fdia').value||0),
        bonus_diamonds: Number($('#fbon').value||0),
        sort_order: Number($('#fsort').value||0),
        image_url: $('#fimg').value.trim() || null,
        description: $('#fdesc').value.trim() || null,
        is_active: $('#factive').checked,
        is_featured: $('#ffeat').checked
      };
      if(!payload.name){ toast('Falta el nombre del paquete', true); return; }
      if(!payload.slug){ toast('Falta el identificador (slug)', true); return; }
      if(payload.diamonds <= 0){ toast('Los diamantes base deben ser mayor a 0', true); return; }
      if(payload.price < 0){ toast('El precio no puede ser negativo', true); return; }
      const q = isNew ? sbJess.from('products').insert(payload) : sbJess.from('products').update(payload).eq('id', id);
      const { error } = await q;
      if(error){ toast(error.message, true); return; }
      toast(isNew?'Producto creado':'Cambios guardados');
      closeModal();
      viewProducts();
    };
    const delHandler = async () => {
      const ok = await askConfirm({
        title: 'Eliminar producto',
        message: `¿Eliminar "${p.name}"? Esta acción no se puede deshacer.`,
        confirmLabel: 'Sí, eliminar',
        danger: true
      });
      if(!ok){ openProductModal(id); return; }
      const { error } = await sbJess.from('products').delete().eq('id', id);
      if(error){ toast(error.message, true); return; }
      toast('Producto eliminado');
      closeModal();
      viewProducts();
    };
    const actions = [];
    if(!isNew) actions.push({ label:'Eliminar', style:'danger', side:'left', onClick:delHandler });
    actions.push({ label:'Cancelar', style:'ghost', onClick:closeModal });
    actions.push({ label: isNew?'Crear producto':'Guardar cambios', style:'primary', onClick:saveHandler });

    openModal({
      title: isNew?'Nuevo producto':'Editar producto',
      subtitle: isNew ? 'Agregar un nuevo paquete de diamantes' : escapeHtml(p.name||''),
      size: 'wide',
      bodyHtml: body,
      actions
    });

    // Auto-generar slug mientras el usuario tipea (mientras no lo edite a mano)
    const slugify = s => String(s||'').toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g,'')
      .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60);
    const slugInput = $('#fslug');
    const nameInput = $('#fname');
    const diaInput  = $('#fdia');
    const bonInput  = $('#fbon');
    let slugTouched = !!(p.slug && p.slug.length);
    slugInput.addEventListener('input', () => { slugTouched = true; });
    const autoSlug = () => {
      if(slugTouched) return;
      const d = Number(diaInput.value||0);
      const b = Number(bonInput.value||0);
      let s = '';
      if(d > 0) s = 'ff-' + (d + b);
      else if(nameInput.value.trim()) s = slugify(nameInput.value);
      slugInput.value = s;
    };
    nameInput.addEventListener('input', autoSlug);
    diaInput.addEventListener('input', autoSlug);
    bonInput.addEventListener('input', autoSlug);
  }
  window.openProductModal = openProductModal;

  async function viewSettings(){
    const m = $('#main');
    m.innerHTML = `<div class="page-head"><div class="titles"><div class="h1">Configuración</div><div class="sub">Datos de contacto y métodos de cobro</div></div><button class="btn ghost" onclick="viewSettings()">Actualizar</button></div><div id="setBox"><div class="muted"><span class="loader"></span> cargando…</div></div>`;
    const { data, error } = await sbJess.from('settings').select('*');
    if(error){ $('#setBox').innerHTML = errBox(error); return; }
    const order = ['whatsapp','payment_banco','payment_tigo','payment_personal'];
    const rows = (data||[]).sort((a,b) => (order.indexOf(a.key)<0?99:order.indexOf(a.key)) - (order.indexOf(b.key)<0?99:order.indexOf(b.key)));
    const box = $('#setBox'); box.innerHTML = '';
    rows.forEach(s => {
      const schema = SETTINGS_SCHEMA[s.key];
      const card = document.createElement('div');
      card.className = 'card';
      card.style.marginBottom = '14px';
      const title = schema ? schema.title : s.key;
      card.innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px"><div><b class="h2">${escapeHtml(title)}</b>${s.description?` <span class="muted" style="font-size:13px">· ${escapeHtml(s.description)}</span>`:''}</div><button class="btn primary small" data-save="${s.key}">Guardar</button></div>`;
      if(schema){
        const grid = document.createElement('div');
        grid.className = 'grid-2';
        schema.fields.forEach(f => {
          const wrap = document.createElement('div');
          wrap.innerHTML = `<label class="label">${escapeHtml(f.label)}</label><input class="input" data-f="${escapeHtml(f.k)}" type="text" placeholder="${escapeHtml(f.ph||'')}" value="${escapeHtml((s.value && s.value[f.k]) || '')}">`;
          grid.appendChild(wrap);
        });
        card.appendChild(grid);
        card.querySelector('[data-save]').onclick = async () => {
          const value = {};
          card.querySelectorAll('[data-f]').forEach(inp => { value[inp.dataset.f] = inp.value.trim(); });
          const { error } = await sbJess.from('settings').update({ value }).eq('key', s.key);
          if(error){ toast(error.message, true); return; }
          toast('Guardado');
        };
      } else {
        const ta = document.createElement('textarea');
        ta.className = 'input';
        ta.rows = 5;
        ta.style.fontFamily = 'monospace';
        ta.style.fontSize = '13px';
        ta.value = JSON.stringify(s.value, null, 2);
        card.appendChild(ta);
        card.querySelector('[data-save]').onclick = async () => {
          let value; try{ value = JSON.parse(ta.value); }catch(e){ toast('JSON inválido', true); return; }
          const { error } = await sbJess.from('settings').update({ value }).eq('key', s.key);
          if(error){ toast(error.message, true); return; }
          toast('Guardado');
        };
      }
      box.appendChild(card);
    });
  }
  window.viewSettings = viewSettings;

  // =====================================================================
  // ACTIVIDAD
  // =====================================================================
  const ACTION_LABEL = { 'order.set_status':'Cambio de estado de pedido', 'payment.review':'Revisión de pago' };

  function formatActivityDetail(action, detail){
    if(!detail) return '<span class="muted">—</span>';
    const parts = [];
    if(action === 'order.set_status'){
      if(detail.status) parts.push(`Marcado como <b>${escapeHtml(STATUS_LABEL[detail.status]||detail.status)}</b>`);
      if(detail.notes)  parts.push(`<span class="muted">Nota: ${escapeHtml(detail.notes)}</span>`);
    } else if(action === 'payment.review'){
      const ok = detail.approve === true || detail.approve === 'true';
      parts.push(ok ? `<span style="color:#7ff0a5;font-weight:800">Pago aprobado</span>` : `<span style="color:#ffb0b4;font-weight:800">Pago rechazado</span>`);
      if(detail.notes) parts.push(`<span class="muted">Nota: ${escapeHtml(detail.notes)}</span>`);
    } else {
      Object.entries(detail).forEach(([k,v]) => {
        if(v === null || v === undefined || v === '') return;
        parts.push(`<span class="muted">${escapeHtml(k)}:</span> ${escapeHtml(String(v))}`);
      });
    }
    return parts.length ? parts.join('<br>') : '<span class="muted">—</span>';
  }

  function shortId(id){
    if(!id) return '';
    return String(id).slice(0,8);
  }

  async function viewActivity(){
    const m = $('#main');
    m.innerHTML = `<div class="page-head"><div class="titles"><div class="h1">Actividad</div><div class="sub">Historial de acciones del panel</div></div><button class="btn ghost" onclick="viewActivity()">Actualizar</button></div><div id="actBox"><div class="muted"><span class="loader"></span> cargando…</div></div>`;
    const { data, error } = await sbJess.from('activity_log').select('*').order('created_at',{ascending:false}).limit(300);
    if(error){ $('#actBox').innerHTML = errBox(error); return; }
    if(!(data||[]).length){ $('#actBox').innerHTML = '<div class="card muted">Todavía no hay actividad registrada.</div>'; return; }

    // Buscar los pedidos relacionados para mostrar el N° en lugar del UUID crudo
    const orderIds = [...new Set((data||[]).filter(r => r.entity === 'order').map(r => r.entity_id))].filter(Boolean);
    let orderMap = {};
    if(orderIds.length){
      const { data:ords } = await sbJess.from('orders').select('id,order_number').in('id', orderIds);
      orderMap = Object.fromEntries((ords||[]).map(o => [o.id, o.order_number]));
    }

    const entityLabel = r => {
      if(!r.entity) return '';
      if(r.entity === 'order' && orderMap[r.entity_id]) return `Pedido <b>${escapeHtml(orderMap[r.entity_id])}</b>`;
      if(r.entity === 'payment') return `Pago <span class="muted" style="font-family:monospace">#${shortId(r.entity_id)}</span>`;
      return `${escapeHtml(r.entity)} <span class="muted" style="font-family:monospace">#${shortId(r.entity_id)}</span>`;
    };

    $('#actBox').innerHTML = `<div class="table-wrap"><div class="table-scroll"><table>
      <thead><tr><th>Cuándo</th><th>Quién</th><th>Sobre</th><th>Acción</th><th>Detalle</th></tr></thead>
      <tbody>${(data||[]).map(r=>`
        <tr>
          <td>${fmtDate(r.created_at)}</td>
          <td>${escapeHtml(r.actor_email||'—')}</td>
          <td>${entityLabel(r)}</td>
          <td>${escapeHtml(ACTION_LABEL[r.action]||r.action)}</td>
          <td style="font-size:14px">${formatActivityDetail(r.action, r.detail)}</td>
        </tr>`).join('')}</tbody></table></div></div>`;
  }
  window.viewActivity = viewActivity;

      if(error){ toast(error.message, true); return; }
      toast('Administrador agregado'); viewAdmins();
    };
    const { data, error } = await sbJess.from('admin_users').select('*').order('created_at');
    if(error){ $('#adBox').innerHTML = errBox(error); return; }
    $('#adBox').innerHTML = `<div class="table-wrap"><div class="table-scroll"><table>
      <thead><tr><th>Correo</th><th>Nombre</th><th>Rol</th><th>Estado</th><th>Creado</th><th></th></tr></thead>
      <tbody>${(data||[]).map(a=>`
        <tr>
          <td><b>${escapeHtml(a.email)}</b><br><span class="muted" style="font-size:11px;font-family:monospace">${escapeHtml(a.user_id)}</span></td>
          <td>${escapeHtml(a.full_name||'—')}</td>
          <td><span class="tag tag-${a.role}">${(ROLE_LABEL[a.role]||a.role).toUpperCase()}</span></td>
          <td>${a.is_active ? '<span class="tag tag-active">ACTIVO</span>' : '<span class="tag tag-inactive">INACTIVO</span>'}</td>
          <td>${fmtDate(a.created_at)}</td>
          <td style="text-align:right">
            <button class="btn small" data-toggle="${a.user_id}" data-active="${a.is_active}">${a.is_active?'Desactivar':'Activar'}</button>
            ${a.user_id !== state.me.id ? `<button class="btn small danger" data-del="${a.user_id}">Eliminar</button>` : ''}
          </td>
        </tr>`).join('')}</tbody></table></div></div>`;
    document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = async () => {
      const { error } = await sbJess.from('admin_users').update({ is_active: b.dataset.active !== 'true' }).eq('user_id', b.dataset.toggle);
      if(error){ toast(error.message, true); return; }
      toast('Actualizado'); viewAdmins();
    });
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      const ok = await askConfirm({ title:'Eliminar administrador', message:'¿Eliminar este administrador? Perderá acceso al panel.', confirmLabel:'Sí, eliminar', danger:true });
      if(!ok) return;
      const { error } = await sbJess.from('admin_users').delete().eq('user_id', b.dataset.del);
      if(error){ toast(error.message, true); return; }
      toast('Eliminado'); viewAdmins();

  window.viewAdmins = viewAdmins;

  function errBox(e){ return `<div class="card" style="border-color:rgba(242,84,91,.4);color:#ffb0b4"><b>Error:</b> ${escapeHtml((e&&e.message)||'algo salió mal')}</div>`; }

  boot();
